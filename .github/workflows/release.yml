name: release

# Push a tag like v0.1.0 → test, build the .exe on Windows, publish a GitHub Release with it attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pyinstaller
      - name: Test
        run: python -m pytest -q
      - name: Build
        run: python -m PyInstaller --noconfirm --clean mjc-folder-cleaner.spec
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/MJC Folder Cleaner.exe" \
            --title "MJC Folder Cleaner $GITHUB_REF_NAME" \
            --notes "Download **MJC Folder Cleaner.exe** below. It's one file with no installer, for Windows 10 and 11. Windows may show a SmartScreen warning because the exe isn't code-signed yet: click **More info**, then **Run anyway**. See the README for what it does and its safety rules."
